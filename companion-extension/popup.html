<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StudyOS Companion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <div class="brand"><img src="studyos-mark.svg" alt="" /><b>StudyOS Companion</b><span id="status">Checking…</span></div>
    <h1>Automatic learning sync</h1>
    <p id="status-copy">Checking whether this browser is paired with your StudyOS account.</p>
    <button id="connect" class="primary">Connect automatic sync</button>
    <button id="capture" class="secondary">Capture current page / selection</button>
    <div id="selection" class="selection">Select useful notes on the page if you want to build a study kit.</div>
    <small>Automatic progress runs only on supported learning sites. No browser-history permission.</small>
  </main>
  <script src="popup.js"></script>
</body>
</html>
